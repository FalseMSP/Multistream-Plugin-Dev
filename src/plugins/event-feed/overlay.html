<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Feed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px;
  }

  #feed {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 380px;
  }

  .event-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.72);
    border-left: 3px solid var(--event-color, #ffffff);
    border-radius: 0 6px 6px 0;
    padding: 8px 12px;
    animation: slideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    backdrop-filter: blur(4px);
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  .event-item.fade-out {
    opacity: 0;
  }

  @keyframes slideIn {
    from { transform: translateX(-24px); opacity: 0; }
    to   { transform: translateX(0);     opacity: 1; }
  }

  .event-emoji {
    font-size: 18px;
    flex-shrink: 0;
    line-height: 1;
  }

  .event-body {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }

  .event-type {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--event-color, #fff);
    line-height: 1;
  }

  .event-main {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .event-detail {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    line-height: 1.2;
  }
</style>
</head>
<body>
<div id="feed"></div>

<script>
  const DISPLAY_MS  = 8000;  // how long each card stays visible
  const FADE_MS     = 400;   // fade-out duration (matches CSS transition)
  const MAX_VISIBLE = 5;     // max cards on screen at once

  const feed = document.getElementById('feed');

  // Rendered event IDs so we don't re-add on reconnect
  const seen = new Set();

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function addEvent(ev) {
    if (seen.has(ev.id)) return;
    seen.add(ev.id);

    // Enforce max visible
    const existing = feed.querySelectorAll('.event-item');
    if (existing.length >= MAX_VISIBLE) {
      // Immediately remove the oldest (bottom, since flex-col + justify-end = bottom = older)
      existing[0].remove();
    }

    const el = document.createElement('div');
    el.className = 'event-item';
    el.style.setProperty('--event-color', ev.color ?? '#ffffff');

    const mainText = ev.username
      ? esc(ev.username) + (ev.detail ? ' <span class="event-detail">— ' + esc(ev.detail) + '</span>' : '')
      : (ev.detail ? esc(ev.detail) : '');

    el.innerHTML =
      '<div class="event-emoji">' + esc(ev.emoji) + '</div>' +
      '<div class="event-body">' +
        '<div class="event-type">' + esc(ev.label) + '</div>' +
        (mainText ? '<div class="event-main">' + mainText + '</div>' : '') +
      '</div>';

    feed.appendChild(el);

    // Auto-remove after DISPLAY_MS
    setTimeout(() => {
      el.classList.add('fade-out');
      setTimeout(() => el.remove(), FADE_MS);
    }, DISPLAY_MS);
  }

  // ── SSE connection ────────────────────────────────────────────────────────

  let lastEventIds = [];

  function connect() {
    const es = new EventSource('/sse');

    es.addEventListener('section', e => {
      try {
        const payload = JSON.parse(e.data);
        if (payload.id !== 'event-feed') return;
        const events = payload.data?.events ?? [];

        // events is newest-first; find ones we haven't seen yet and add in
        // chronological order (oldest new first so newest ends up at bottom)
        const fresh = events.filter(ev => !seen.has(ev.id)).reverse();
        for (const ev of fresh) addEvent(ev);
      } catch (err) {
        console.error('[event-feed] parse error', err);
      }
    });

    es.onerror = () => {
      es.close();
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
