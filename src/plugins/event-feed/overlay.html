<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Feed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
  }

  #feed {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 400px;
  }

  .event-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.82);
    border-left: 4px solid var(--ec, #fff);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    position: relative;
    overflow: hidden;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  /* shimmer sweep on entry */
  .event-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
    transform: translateX(-100%);
    animation: shimmerSweep 0.6s 0.2s ease forwards;
    pointer-events: none;
  }

  /* colored glow on left edge */
  .event-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 80px;
    background: linear-gradient(90deg, var(--ec, #fff) 0%, transparent 100%);
    opacity: 0.07;
    pointer-events: none;
  }

  .event-item.fade-out {
    opacity: 0;
    transform: translateX(-16px);
  }

  @keyframes popIn {
    from { transform: translateX(-32px) scale(0.92); opacity: 0; }
    to   { transform: translateX(0) scale(1); opacity: 1; }
  }

  @keyframes shimmerSweep {
    from { transform: translateX(-100%); }
    to   { transform: translateX(200%); }
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: inset 4px 0 0 var(--ec, #fff), 0 0 0 rgba(0,0,0,0); }
    50%       { box-shadow: inset 4px 0 0 var(--ec, #fff), -4px 0 18px var(--ec, #fff); }
  }

  /* pulse glow on legendary/mythic/1of1 */
  .event-item.glow-pulse {
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               pulseGlow 2s 0.4s ease-in-out 3;
  }

  .event-emoji {
    font-size: 22px;
    flex-shrink: 0;
    line-height: 1;
    filter: drop-shadow(0 0 6px var(--ec, rgba(255,255,255,0.4)));
  }

  .event-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }

  .event-type {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ec, #fff);
    line-height: 1;
    text-shadow: 0 0 8px var(--ec, rgba(255,255,255,0.5));
  }

  .event-main {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  .event-detail {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    line-height: 1.2;
    font-weight: 400;
  }

  /* little accent pip on the right for big events */
  .event-pip {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 800;
    color: var(--ec, #fff);
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--ec, #fff);
    border-radius: 4px;
    padding: 2px 7px;
    letter-spacing: 0.05em;
    text-shadow: 0 0 8px var(--ec, rgba(255,255,255,0.5));
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="feed"></div>

<script>
  const DISPLAY_MS = 8000;
  const FADE_MS    = 500;
  const MAX_VISIBLE = 5;

  const feed = document.getElementById('feed');
  const seen = new Set();

  // Events that deserve a glow pulse + right pip
  const BIG_EVENTS = new Set(['sub', 'resub', 'subgift', 'bits', 'raid']);

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function pipLabel(ev) {
    if (ev.type === 'raid' && ev.detail) return ev.detail;
    if (ev.type === 'bits' && ev.detail) return ev.detail;
    if (ev.type === 'subgift' && ev.detail) return ev.detail;
    if (ev.type === 'resub' && ev.detail) return ev.detail;
    return null;
  }

  function addEvent(ev) {
    if (seen.has(ev.id)) return;
    seen.add(ev.id);

    const existing = feed.querySelectorAll('.event-item');
    if (existing.length >= MAX_VISIBLE) {
      const oldest = existing[0];
      oldest.classList.add('fade-out');
      setTimeout(() => oldest.remove(), FADE_MS);
    }

    const el = document.createElement('div');
    el.className = 'event-item' + (BIG_EVENTS.has(ev.type) ? ' glow-pulse' : '');
    el.style.setProperty('--ec', ev.color ?? '#ffffff');

    const pip = pipLabel(ev);

    el.innerHTML =
      '<div class="event-emoji">' + esc(ev.emoji) + '</div>' +
      '<div class="event-body">' +
        '<div class="event-type">' + esc(ev.label) + '</div>' +
        (ev.username
          ? '<div class="event-main">' + esc(ev.username) + '</div>'
          : '') +
        (ev.detail && !pip
          ? '<div class="event-detail">' + esc(ev.detail) + '</div>'
          : '') +
      '</div>' +
      (pip ? '<div class="event-pip">' + esc(pip) + '</div>' : '');

    feed.appendChild(el);

    setTimeout(() => {
      el.classList.add('fade-out');
      setTimeout(() => el.remove(), FADE_MS);
    }, DISPLAY_MS);
  }

  function connect() {
    const es = new EventSource('/sse');

    // FIX: use onmessage (not addEventListener('section',...)) to match
    // how the overlay server emits SSE — it wraps all sections as generic
    // message events with a JSON body containing { type, id, data }.
    es.onmessage = function(e) {
      try {
        const payload = JSON.parse(e.data);
        if (payload.id !== 'event-feed') return;
        const events = payload.data?.events ?? [];
        const fresh = events.filter(ev => !seen.has(ev.id)).reverse();
        for (const ev of fresh) addEvent(ev);
      } catch (err) {
        console.error('[event-feed] parse error', err);
      }
    };

    es.onerror = () => {
      es.close();
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
